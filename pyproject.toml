[project]
name = "gdm-talks"
version = "0.1.0"
description = "A collection of talks, snippets, and research agents for GDM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "websockets>=13.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "ipython>=8.20.0",
]

[tool.uv]
package = false
